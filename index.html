<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車牌獵人</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #555;
    --accent: #e8ff47;
    --danger: #ff4757;
    --cursed: #ff0044;
    --ur: #ff9500;
    --ssr: #c084fc;
    --srplus: #f472b6;
    --sr: #60a5fa;
    --r: #34d399;
    --n: #555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  header {
    padding: 24px 20px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .day-badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Hero progress */
  .progress-hero {
    padding: 28px 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .big-number {
    font-size: clamp(52px, 14vw, 88px);
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.03em;
  }

  .big-label {
    font-size: 13px;
    color: var(--muted);
    margin-top: 5px;
    letter-spacing: 0.04em;
  }

  .stats-row {
    display: flex;
    gap: 28px;
    margin-top: 20px;
  }

  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--text); }
  .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

  /* Main progress bar */
  .progress-bar-wrap {
    margin-top: 20px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  /* Rarity breakdown */
  .rarity-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .rarity-title {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .rarity-bars { display: flex; flex-direction: column; gap: 9px; }

  .rarity-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rarity-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    width: 54px;
    flex-shrink: 0;
  }

  .rarity-bar-bg {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .rarity-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  .rarity-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    width: 28px;
    text-align: right;
    flex-shrink: 0;
  }

  .rarity-max {
    font-size: 10px;
    color: var(--border);
    width: 20px;
    flex-shrink: 0;
  }

  /* Upload */
  .upload-section { padding: 20px; border-bottom: 1px solid var(--border); }

  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(232,255,71,0.04);
  }

  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .drop-icon { font-size: 28px; margin-bottom: 8px; }
  .drop-text { font-size: 13px; color: var(--muted); }
  .drop-text strong { color: var(--accent); font-weight: 600; }

  /* Processing */
  .processing {
    display: none; padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    align-items: center; gap: 12px;
  }
  .processing.active { display: flex; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing-text { font-size: 13px; color: var(--muted); }

  /* Result card */
  .result-card { display: none; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .result-card.active { display: block; }

  .result-inner {
    background: var(--surface);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .result-img {
    width: 90px; height: 90px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--border);
  }

  .result-info { flex: 1; min-width: 0; }

  .plate-detected {
    font-size: 26px; font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .rarity-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 7px;
    border-radius: 3px;
    margin-top: 4px;
  }

  .result-status { font-size: 12px; margin-top: 5px; color: var(--muted); }
  .result-status.new { color: #4ade80; }
  .result-status.dupe { color: var(--muted); }
  .result-status.same-car { color: var(--danger); }

  .result-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  .btn {
    padding: 6px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.82; }
  .btn-primary { background: var(--accent); color: #0e0e0e; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .error-msg { font-size: 12px; color: var(--danger); margin-top: 6px; }

  /* Manual input */
  .manual-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .manual-label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .manual-row { display: flex; gap: 8px; }

  .plate-input {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 0.1em;
    outline: none;
    transition: border-color 0.2s;
  }
  .plate-input:focus { border-color: var(--accent); }

  /* Collection */
  .collection-section { padding: 20px 20px 0; }

  .section-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
  }
  .section-title { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

  .filter-row {
    display: flex; gap: 5px; margin-bottom: 14px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .filter-btn {
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    cursor: pointer; border: 1.5px solid var(--border);
    background: transparent; color: var(--muted);
    font-family: inherit; white-space: nowrap; transition: all 0.15s;
  }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.08); }

  .plate-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
    gap: 6px;
  }

  .plate-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 4px 6px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .plate-chip:hover { border-color: var(--danger); }
  .plate-chip:hover::after {
    content: '✕';
    position: absolute;
    top: -5px; right: -5px;
    width: 14px; height: 14px;
    background: var(--danger);
    color: white; border-radius: 50%;
    font-size: 8px; line-height: 14px;
  }

  .chip-num { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }

  .chip-rarity {
    display: block;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.06em;
    margin-top: 3px;
  }

  .chip-count {
    display: block;
    font-size: 9px;
    color: var(--muted);
    margin-top: 1px;
  }

  .empty-state {
    text-align: center; padding: 40px 20px;
    color: var(--muted); font-size: 13px;
  }

  .toast {
    position: fixed; bottom: 72px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #0e0e0e;
    padding: 9px 18px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    opacity: 0; transition: all 0.3s;
    pointer-events: none; white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Tab bar */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #111; border-top: 1px solid var(--border);
    display: flex; z-index: 50;
  }
  .tab-btn {
    flex: 1; padding: 10px 0 12px;
    background: transparent; border: none;
    font-family: inherit; font-size: 10px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted); cursor: pointer; transition: color 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tab-btn .tab-icon { font-size: 18px; line-height: 1; }
  .tab-btn.active { color: var(--accent); }

  /* Pages */
  .page { display: none; }
  .page.active { display: block; }

  /* Achievements */
  .achievements-section { padding: 20px 20px 0; }
  .ach-header { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px; display: flex; justify-content: space-between; }
  .ach-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .ach-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 13px 14px;
    display: flex; align-items: center; gap: 12px; transition: border-color 0.2s;
  }
  .ach-card.unlocked { border-color: rgba(232,255,71,0.4); }
  .ach-card:not(.unlocked) { opacity: 0.38; }
  .ach-icon { font-size: 26px; flex-shrink: 0; }
  .ach-info { flex: 1; min-width: 0; }
  .ach-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .ach-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ach-plates { font-size: 10px; color: var(--accent); margin-top: 3px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ach-status { font-size: 18px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="page active" id="page-main">
<header>
  <span class="logo">車牌獵人</span>

</header>

<div class="progress-hero">
  <div class="big-number" id="pct-display">0%</div>
  <div class="big-label">收集進度 · <span id="count-of">0 / 10000</span></div>
  <div class="stats-row">
    <div class="stat">
      <span class="stat-val" id="count-display">0</span>
      <span class="stat-lbl">獨特號碼</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="photos-display">0</span>
      <span class="stat-lbl">總張數</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="today-display">0</span>
      <span class="stat-lbl">今天</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="streak-display">0</span>
      <span class="stat-lbl">連續天</span>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<!-- Rarity breakdown -->
<div class="rarity-section">
  <div class="rarity-title">稀有度統計</div>
  <div class="rarity-bars" id="rarity-bars"></div>
</div>

<div class="upload-section">
  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept="image/*" multiple>
    <div class="drop-icon">📷</div>
    <div class="drop-text">拍照上傳，<strong>自動裁切 1:1</strong>，手動輸入號碼</div>
  </div>
</div>

<div class="processing" id="processing">
  <div class="spinner"></div>
  <span class="processing-text" id="processing-text">AI 辨識中...</span>
</div>

<div class="result-card" id="result-card">
  <div class="result-inner">
    <img id="result-img" class="result-img" src="" alt="">
    <div class="result-info">
      <div class="plate-detected" id="plate-number">—</div>
      <div id="rarity-badge-el"></div>
      <div class="result-status" id="result-status"></div>
      <div class="result-actions" id="result-actions"></div>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>
</div>

<div class="manual-section">
  <div class="manual-label">手動新增</div>
  <div class="manual-row">
    <input class="plate-input" id="manual-input" type="text" maxlength="4" placeholder="0000" inputmode="numeric">
    <button class="btn btn-primary" id="manual-add">新增</button>
  </div>
</div>

<div class="collection-section">
  <div class="section-header">
    <span class="section-title">收集記錄</span>
    <span class="section-title" id="showing-count"></span>
  </div>
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="cursed">CURSED</button>
    <button class="filter-btn" data-filter="ur">UR</button>
    <button class="filter-btn" data-filter="ssr">SSR</button>
    <button class="filter-btn" data-filter="srplus">SR+</button>
    <button class="filter-btn" data-filter="sr">SR</button>
    <button class="filter-btn" data-filter="r">R</button>
    <button class="filter-btn" data-filter="n">N</button>
  </div>
  <div class="plate-grid" id="plate-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none">還沒有收集記錄，上傳照片或手動新增</div>
</div>


</div><!-- end page-main -->

<!-- Achievements page -->
<div class="page" id="page-achievements">
  <div class="achievements-section">
    <div class="ach-header">
      <span>成就</span>
      <span id="ach-count-label"></span>
    </div>
    <div class="ach-grid" id="ach-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="tab-bar">
  <button class="tab-btn active" id="tab-main" onclick="switchTab('main')">
    <span class="tab-icon">🚗</span>收集
  </button>
  <button class="tab-btn" id="tab-achievements" onclick="switchTab('achievements')">
    <span class="tab-icon">🏆</span>成就
  </button>
</nav>

<script>
const START_DATE = new Date(Date.UTC(2025, 0, 11));
const TOTAL = 10000;

// collection: { [plate]: { count: N, photos: [{hash, croppedUrl}] } }
let collection = {};
let dailyCounts = {};
try {
  collection = JSON.parse(localStorage.getItem('plate_collection_v2') || '{}');
  dailyCounts = JSON.parse(localStorage.getItem('plate_daily_v2') || '{}');
} catch(e) {}
let todayStr = new Date().toISOString().slice(0,10);
let currentFilter = 'all';
let pendingPlate = null;
let pendingImgUrl = null;
let pendingHash = null;

function save() {
  const toSave = {};
  for (const [p, v] of Object.entries(collection)) {
    toSave[p] = { count: v.count, hashes: v.hashes || [] };
  }
  try {
    localStorage.setItem('plate_collection_v2', JSON.stringify(toSave));
    localStorage.setItem('plate_daily_v2', JSON.stringify(dailyCounts));
  } catch(e) {
    console.error('Save error:', e);
  }
}

// --- Rarity system ---
const RARITY_DEF = [
  { key: 'cursed', label: 'CURSED', color: '#ff0044', total: 1,
    check: p => p === '4444' },
  { key: 'ur',     label: 'UR',     color: '#ff9500', total: 4,
    check: p => ['0000','9999','6666','8888'].includes(p) },
  { key: 'ssr',    label: 'SSR',    color: '#c084fc', total: 7,
    check: p => /^(\d)\1{3}$/.test(p) && !['0000','4444','6666','8888','9999'].includes(p) },
  { key: 'srplus', label: 'SR+',    color: '#f472b6', total: 108,
    check: p => {
      if (p === '4444') return false;
      const fours = p.split('').filter(c => c === '4').length;
      return fours === 3;
    }
  },
  { key: 'sr',     label: 'SR',     color: '#60a5fa', total: 14,
    check: p => {
      const d = p.split('').map(Number);
      const asc  = d[1]-d[0]===1 && d[2]-d[1]===1 && d[3]-d[2]===1;
      const desc = d[0]-d[1]===1 && d[1]-d[2]===1 && d[2]-d[3]===1;
      return asc || desc;
    }
  },
  { key: 'r',      label: 'R',      color: '#34d399', total: null,
    check: p => {
      // repeating pattern: AABB, ABAB, AABC with repeat, palindrome
      const d = p.split('');
      const aabb = d[0]===d[1] && d[2]===d[3] && d[0]!==d[2];
      const abab = d[0]===d[2] && d[1]===d[3] && d[0]!==d[1];
      const palindrome = d[0]===d[3] && d[1]===d[2];
      const aaab = /^(\d)\1{2}\d$/.test(p) || /^\d(\d)\1{2}$/.test(p);
      return (aabb || abab || palindrome || aaab) && !isHigherRarity(p, 'r');
    }
  },
  { key: 'n',      label: 'N',      color: '#555',    total: null, check: () => true },
];

function isHigherRarity(p, stopAt) {
  for (const r of RARITY_DEF) {
    if (r.key === stopAt) return false;
    if (r.check(p)) return true;
  }
  return false;
}

function getRarity(plate) {
  for (const r of RARITY_DEF) {
    if (r.check(plate)) return r;
  }
  return RARITY_DEF[RARITY_DEF.length - 1];
}

// --- Unique plates ---
function uniquePlates() { return Object.keys(collection); }
function totalPhotos() { return Object.values(collection).reduce((s,v) => s + (v.count||1), 0); }

function daysSince() {
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.floor((today - START_DATE) / 86400000);
  return diff + 1;
}

function calcStreak() {
  let streak = 0;
  let d = new Date();
  while (true) {
    const s = d.toISOString().slice(0,10);
    if (dailyCounts[s] > 0) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function updateUI() {
  const plates = uniquePlates();
  const count = plates.length;
  const pct = ((count / TOTAL) * 100).toFixed(2);
  document.getElementById('pct-display').textContent = pct + '%';
  document.getElementById('count-of').textContent = `${count} / ${TOTAL}`;
  document.getElementById('count-display').textContent = count;
  document.getElementById('photos-display').textContent = totalPhotos();
  document.getElementById('today-display').textContent = dailyCounts[todayStr] || 0;
  document.getElementById('streak-display').textContent = calcStreak();
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('day-count').textContent = 'DAY ' + daysSince();
  renderRarityBars(plates);
  renderGrid();
}

function renderRarityBars(plates) {
  const counts = {};
  for (const r of RARITY_DEF) counts[r.key] = 0;
  for (const p of plates) { const r = getRarity(p); counts[r.key]++; }

  const container = document.getElementById('rarity-bars');
  container.innerHTML = RARITY_DEF.map(r => {
    const have = counts[r.key];
    const max = r.total;
    const pct = max ? Math.min(100, (have / max) * 100) : (have > 0 ? 100 : 0);
    const maxLabel = max ? `/${max}` : '';
    return `<div class="rarity-row">
      <span class="rarity-label" style="color:${r.color}">${r.label}</span>
      <div class="rarity-bar-bg">
        <div class="rarity-bar-fill" style="width:${pct}%;background:${r.color}"></div>
      </div>
      <span class="rarity-count" style="color:${r.color}">${have}</span>
      <span class="rarity-max">${maxLabel}</span>
    </div>`;
  }).join('');
}

function renderGrid() {
  const grid = document.getElementById('plate-grid');
  const empty = document.getElementById('empty-state');
  const plates = uniquePlates();

  let filtered = currentFilter === 'all'
    ? plates
    : plates.filter(p => getRarity(p).key === currentFilter);

  filtered.sort((a,b) => {
    const ra = RARITY_DEF.findIndex(r => r.check(a));
    const rb = RARITY_DEF.findIndex(r => r.check(b));
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b);
  });

  document.getElementById('showing-count').textContent =
    filtered.length === plates.length
      ? `${plates.length} 種`
      : `${filtered.length} / ${plates.length} 種`;

  if (!plates.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(p => {
    const r = getRarity(p);
    const cnt = collection[p]?.count || 1;
    const countStr = cnt > 1 ? `<span class="chip-count">×${cnt}</span>` : '';
    return `<div class="plate-chip" title="點擊刪除 ${p}" onclick="removeIfConfirm('${p}')">
      <div class="chip-num" style="color:${r.color}">${p}</div>
      <span class="chip-rarity" style="color:${r.color}">${r.label}</span>
      ${countStr}
    </div>`;
  }).join('');
}

function removeIfConfirm(plate) {
  if (confirm(`刪除 ${plate}？`)) {
    const cnt = collection[plate]?.count || 1;
    delete collection[plate];
    if (dailyCounts[todayStr] > 0) dailyCounts[todayStr] = Math.max(0, dailyCounts[todayStr] - 1);
    save(); updateUI();
    showToast(`已刪除 ${plate}`);
  }
}

function addPlate(plate, hash, croppedUrl, isNewUnique) {
  const norm = plate.padStart(4,'0');
  if (!/^\d{4}$/.test(norm)) { showToast('格式錯誤，需要4位數字'); return false; }

  if (hash && collection[norm]) {
    // Check same car (same hash)
    const hashes = collection[norm].hashes || [];
    if (hashes.includes(hash)) {
      showToast(`同一輛車已經拍過了`);
      return 'same-car';
    }
  }

  if (!collection[norm]) {
    // New unique plate
    collection[norm] = { count: 1, hashes: hash ? [hash] : [] };
    dailyCounts[todayStr] = (dailyCounts[todayStr] || 0) + 1;
    save(); updateUI();
    const r = getRarity(norm);
    showToast(`✓ ${norm} · ${r.label} 解鎖！`);
    return 'new';
  } else {
    // Duplicate plate number, new photo
    collection[norm].count = (collection[norm].count || 1) + 1;
    if (hash) collection[norm].hashes = [...(collection[norm].hashes||[]), hash];
    save(); updateUI();
    showToast(`${norm} 已有 ${collection[norm].count} 張`);
    return 'dupe';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// Simple image hash (for same-car detection)
async function imageHash(base64) {
  const bytes = atob(base64.substring(0, 2000));
  let hash = 0;
  for (let i = 0; i < bytes.length; i++) {
    hash = ((hash << 5) - hash) + bytes.charCodeAt(i);
    hash |= 0;
  }
  return hash.toString(36);
}

async function processImage(file) {
  const processing = document.getElementById('processing');
  const resultCard = document.getElementById('result-card');
  const procText = document.getElementById('processing-text');

  resultCard.classList.remove('active');
  processing.classList.add('active');
  procText.textContent = '裁切中...';

  const imgUrl = URL.createObjectURL(file);
  const base64 = await toBase64(file);
  const hash = await imageHash(base64);

  try {
    // Auto crop to 1:1 centered
    const croppedUrl = await cropCenter(imgUrl);
    processing.classList.remove('active');
    showCropResult(croppedUrl, hash);
  } catch(err) {
    processing.classList.remove('active');
    showCropResult(imgUrl, hash);
  }
}

function cropCenter(imgUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const side = Math.min(iw, ih);
      const sx = (iw - side) / 2;
      const sy = (ih - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1000;
      canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, 1000, 1000);
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = reject;
    img.src = imgUrl;
  });
}

function showCropResult(croppedUrl, hash) {
  const card = document.getElementById('result-card');
  document.getElementById('result-img').src = croppedUrl;
  document.getElementById('error-msg').textContent = '';
  document.getElementById('rarity-badge-el').innerHTML = '';
  document.getElementById('plate-number').textContent = '?';
  document.getElementById('result-status').className = 'result-status';
  document.getElementById('result-status').textContent = '請輸入車牌號碼';

  pendingImgUrl = croppedUrl;
  pendingHash = hash;
  pendingPlate = null;

  document.getElementById('result-actions').innerHTML = `
    <input class="plate-input" id="crop-input" type="text" maxlength="4" placeholder="0000" inputmode="numeric" style="width:100px;font-size:16px;padding:6px 10px">
    <button class="btn btn-primary" onclick="confirmCropAdd()">加入</button>
    <button class="btn btn-ghost" onclick="downloadCropDirect()">下載</button>
    <button class="btn btn-ghost" onclick="closeResult()">取消</button>
  `;
  card.classList.add('active');
  setTimeout(() => document.getElementById('crop-input')?.focus(), 100);
}

function confirmCropAdd() {
  const val = document.getElementById('crop-input')?.value.trim();
  if (!val) return;
  const norm = val.padStart(4,'0');
  if (!/^\d{4}$/.test(norm)) { showToast('需要4位數字'); return; }
  pendingPlate = norm;
  addPlate(norm, pendingHash, pendingImgUrl);
  closeResult();
}

function downloadCropDirect() {
  if (!pendingImgUrl) return;
  const val = document.getElementById('crop-input')?.value.trim() || 'plate';
  const a = document.createElement('a');
  a.href = pendingImgUrl;
  a.download = `plate_${val}.jpg`;
  a.click();
}

function cropToSquare(imgUrl, box) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      let bx = box.x*iw, by = box.y*ih, bw = box.w*iw, bh = box.h*ih;
      const side = Math.max(bw, bh);
      const cx = bx + bw/2, cy = by + bh/2;
      const padded = side * 1.1;
      let sx = Math.max(0, cx - padded/2);
      let sy = Math.max(0, cy - padded/2);
      let sw = padded, sh = padded;
      if (sx+sw > iw) sx = iw-sw;
      if (sy+sh > ih) sy = ih-sh;
      sx = Math.max(0,sx); sy = Math.max(0,sy);
      sw = Math.min(sw, iw-sx); sh = Math.min(sh, ih-sy);
      const finalSide = Math.min(sw,sh);
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1000;
      canvas.getContext('2d').drawImage(img, sx, sy, finalSide, finalSide, 0, 0, 1000, 1000);
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = reject;
    img.src = imgUrl;
  });
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('讀取失敗'));
    r.readAsDataURL(file);
  });
}

function showResult(imgUrl, result, hash) {
  const card = document.getElementById('result-card');
  document.getElementById('result-img').src = imgUrl;
  document.getElementById('error-msg').textContent = '';
  document.getElementById('result-actions').innerHTML = '';
  document.getElementById('rarity-badge-el').innerHTML = '';

  if (result.found && result.plate) {
    const plate = result.plate.padStart(4,'0');
    document.getElementById('plate-number').textContent = plate;
    pendingPlate = plate;
    pendingImgUrl = imgUrl;
    pendingHash = hash;

    const r = getRarity(plate);
    document.getElementById('rarity-badge-el').innerHTML =
      `<span class="rarity-badge" style="background:${r.color}22;color:${r.color}">${r.label}</span>`;

    const existing = collection[plate];
    const hashes = existing?.hashes || [];
    const isSameCar = hash && hashes.includes(hash);

    if (isSameCar) {
      document.getElementById('result-status').className = 'result-status same-car';
      document.getElementById('result-status').textContent = '同一輛車已拍過';
      document.getElementById('result-actions').innerHTML =
        `<button class="btn btn-ghost" onclick="closeResult()">關閉</button>`;
    } else if (existing) {
      document.getElementById('result-status').className = 'result-status dupe';
      document.getElementById('result-status').textContent = `已有 ${existing.count} 張，再收一張？`;
      document.getElementById('result-actions').innerHTML = `
        <button class="btn btn-primary" onclick="confirmAdd()">再收一張</button>
        <button class="btn btn-ghost" onclick="downloadCropped('${plate}')">下載裁切圖</button>
        <button class="btn btn-ghost" onclick="closeResult()">取消</button>`;
    } else {
      document.getElementById('result-status').className = 'result-status new';
      document.getElementById('result-status').textContent = '新號碼！';
      document.getElementById('result-actions').innerHTML = `
        <button class="btn btn-primary" onclick="confirmAdd()">加入收集</button>
        <button class="btn btn-ghost" onclick="downloadCropped('${plate}')">下載裁切圖</button>
        <button class="btn btn-ghost" onclick="closeResult()">取消</button>`;
    }
  } else {
    document.getElementById('plate-number').textContent = '?';
    document.getElementById('result-status').className = 'result-status';
    document.getElementById('result-status').textContent = '辨識不到車牌';
    document.getElementById('error-msg').textContent = result.error || '請確認圖片清晰，或手動輸入';
    document.getElementById('result-actions').innerHTML =
      `<button class="btn btn-ghost" onclick="closeResult()">關閉</button>`;
  }

  card.classList.add('active');
}

function confirmAdd() {
  if (pendingPlate) {
    addPlate(pendingPlate, pendingHash, pendingImgUrl);
    closeResult();
  }
}

function downloadCropped(plate) {
  if (!pendingImgUrl) return;
  const a = document.createElement('a');
  a.href = pendingImgUrl;
  a.download = `plate_${plate}.jpg`;
  a.click();
}

function closeResult() {
  document.getElementById('result-card').classList.remove('active');
  pendingPlate = pendingImgUrl = pendingHash = null;
}

// --- Achievement definitions ---
// Helper: generate all plates for each achievement
function genTetsu() { return Array.from({length:10},(_,i)=>String(i).repeat(4)); }
function genSanjo() {
  const r=new Set();
  for(let d=0;d<10;d++) for(let x=0;x<10;x++) if(x!==d){r.add(`${d}${d}${d}${x}`);r.add(`${x}${d}${d}${d}`);}
  return [...r].sort();
}
function genDuizi() {
  const r=[];
  for(let a=0;a<10;a++) for(let b=0;b<10;b++) if(a!==b) r.push(`${a}${a}${b}${b}`);
  return r.sort();
}
function genShunzi() {
  const r=[];
  for(let i=0;i<=6;i++) r.push(`${i}${i+1}${i+2}${i+3}`);
  for(let i=9;i>=3;i--) r.push(`${i}${i-1}${i-2}${i-3}`);
  return r;
}
function genQianyuan() { return Array.from({length:9},(_,i)=>`${i+1}000`); }
function genJingxiang() {
  const r=new Set();
  for(let a=0;a<10;a++) for(let b=0;b<10;b++) if(a!==b) r.add(`${a}${b}${b}${a}`);
  return [...r].sort();
}

const ACH_PLATES = {
  forbidden: ['4444'],
  tetsu: genTetsu(),
  sanjo: genSanjo(),
  duizi: genDuizi(),
  shunzi: genShunzi(),
  qianyuan: genQianyuan(),
  jingxiang: genJingxiang(),
  daji: ['1688','5168','8888','6666','6688','1680','0168'],
  tsmc: ['2330'],
};

const ACHIEVEMENTS = [
  { key:'forbidden', icon:'☠️', name:'禁忌',    desc:'收集到傳說中的死亡號碼' },
  { key:'tetsu',     icon:'🀄', name:'鐵支',    desc:`集齊所有四個相同數字（${ACH_PLATES.tetsu.length}個）` },
  { key:'sanjo',     icon:'🎯', name:'三條',    desc:`集齊所有三連號（${ACH_PLATES.sanjo.length}個）` },
  { key:'duizi',     icon:'♟️', name:'對子',    desc:`集齊所有兩對數字（${ACH_PLATES.duizi.length}個）` },
  { key:'shunzi',    icon:'⚡', name:'順子',    desc:`集齊所有連續四位數（${ACH_PLATES.shunzi.length}個）` },
  { key:'qianyuan',  icon:'💰', name:'千元',    desc:`集齊所有整千數字（${ACH_PLATES.qianyuan.length}個）` },
  { key:'jingxiang', icon:'🪞', name:'鏡像',    desc:`集齊所有回文數字（${ACH_PLATES.jingxiang.length}個）` },
  { key:'daji',      icon:'🧧', name:'大吉大利', desc:`集齊所有吉祥號碼（${ACH_PLATES.daji.length}個）` },
  { key:'tsmc',      icon:'📈', name:'台股奇蹟', desc:'收集到台積電股票代號 2330' },
];

function getAchProgress(key, plates) {
  const required = ACH_PLATES[key];
  const have = required.filter(p => plates.includes(p));
  return { have: have.length, total: required.length, done: have.length === required.length, plates: have };
}

function renderAchievements() {
  const plates = uniquePlates();
  const grid = document.getElementById('ach-grid');
  const label = document.getElementById('ach-count-label');

  const progresses = ACHIEVEMENTS.map(a => ({ ...a, prog: getAchProgress(a.key, plates) }));
  const doneCount = progresses.filter(a => a.prog.done).length;
  label.textContent = `${doneCount} / ${ACHIEVEMENTS.length}`;

  const sorted = [...progresses].sort((a,b) => {
    if (a.prog.done && !b.prog.done) return -1;
    if (!a.prog.done && b.prog.done) return 1;
    // Sort in-progress by percentage
    return (b.prog.have/b.prog.total) - (a.prog.have/a.prog.total);
  });

  grid.innerHTML = sorted.map(a => {
    const { have, total, done, plates: havePlates } = a.prog;
    const pct = Math.round((have/total)*100);
    const platesStr = havePlates.length ? havePlates.slice(0,5).join('、') + (havePlates.length > 5 ? `…` : '') : '';
    return `<div class="ach-card ${done ? 'unlocked' : ''}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-info">
        <div class="ach-name">${a.name}</div>
        <div class="ach-desc">${a.desc}</div>
        <div style="margin-top:6px;height:3px;background:var(--border);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${done?'var(--accent)':'#555'};border-radius:2px;transition:width 0.4s"></div>
        </div>
        ${platesStr ? `<div class="ach-plates" style="margin-top:4px">${platesStr}</div>` : ''}
      </div>
      <div class="ach-status">${done ? '✅' : `<span style="font-size:11px;color:var(--muted)">${have}/${total}</span>`}</div>
    </div>`;
  }).join('');
}

// Tab switching
function switchTab(tab) {
  document.getElementById('page-main').classList.toggle('active', tab === 'main');
  document.getElementById('page-achievements').classList.toggle('active', tab === 'achievements');
  document.getElementById('tab-main').classList.toggle('active', tab === 'main');
  document.getElementById('tab-achievements').classList.toggle('active', tab === 'achievements');
  if (tab === 'achievements') renderAchievements();
}
